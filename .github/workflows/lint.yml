name: lint
on: [push, pull_request]
jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks
          sudo luarocks install luacheck
      - name: Syntax (luajit -bl)
        run: luajit -bl eclipse.lua > /dev/null
      - name: luacheck
        run: luacheck .
